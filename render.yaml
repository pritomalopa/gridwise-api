# One-click Render blueprint. Add ANTHROPIC_API_KEY in the dashboard, not here.
services:
  - type: web
    name: gridwise-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build && cd frontend && npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-sonnet-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_URL
        sync: false
